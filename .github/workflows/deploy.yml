name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Match withastro/action@v6's default, so the type check and the
          # deployed build run on the same Node major.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Tell IndexNow the pages changed, instead of waiting for a crawl to
      # notice. One ping reaches Bing, Yandex and the other participants;
      # Bing's index is what ChatGPT and Copilot retrieve from. The key file
      # lives in public/ and proves we own the host. Best-effort: a refused
      # ping must never fail a deploy that already succeeded.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          KEY: 284b4935a29eb2bebc3e59e945924718
          HOST: bramvermeulen.github.io
        run: |
          curl -sS -m 30 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json' \
            -d "{
              \"host\": \"$HOST\",
              \"key\": \"$KEY\",
              \"keyLocation\": \"https://$HOST/$KEY.txt\",
              \"urlList\": [
                \"https://$HOST/\",
                \"https://$HOST/projects/portfolio\"
              ]
            }" || true
